name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  compose:
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build -d --wait
      - run: scripts/probar.sh
      - if: failure()
        run: docker compose logs
      - run: docker compose down -v
